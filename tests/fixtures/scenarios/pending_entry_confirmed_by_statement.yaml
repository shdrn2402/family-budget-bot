id: pending_entry_confirmed_by_statement
description: >
  A card purchase typed in the bot stays pending until the card statement confirms it.
  The statement's text, date and id win; the manual category is kept and the typed text
  moves to the comment.
steps:
  - manual_entry: {user: alice, item: lunch, amount: 50, account: alice_card, category: restaurants, date: 2026-06-10, expect: pending}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -50, date: 2026-06-11, external_id: isracard_77, description: RESTAURANT XYZ}
      expect_saved: 1
expected:
  - {user: alice, account: alice_card, amount: -50, date: 2026-06-11, status: confirmed, source_type: import_xls,
     external_id: isracard_77, description: RESTAURANT XYZ, comment: lunch, category: restaurants}
