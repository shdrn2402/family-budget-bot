id: card_line_takes_over_an_existing_bit_line
description: Bit export first, card statement second. The card statement's id becomes authoritative; its text joins the comment.
steps:
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-10, external_id: bit_existing, description: Transfer,
           comment: Dana Cohen, source_type: import_bit}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-10, external_id: isracard_new, description: BIT TRANSFER}
      expect_saved: 1
expected:
  - {user: alice, account: alice_card, amount: -80, date: 2026-06-10, status: confirmed, source_type: import_xls,
     external_id: isracard_new, description: Transfer, comment: "Dana Cohen, BIT TRANSFER"}
