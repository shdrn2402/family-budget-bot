id: reimported_bit_line_is_a_duplicate
description: Uploading the same Bit export again after it merged into a card row changes nothing.
steps:
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-10, external_id: isracard_bit, description: BIT TRANSFER}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-11, external_id: bit_new, description: Transfer,
           comment: Dana Cohen, source_type: import_bit}
      expect_saved: 1
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-11, external_id: bit_new, description: Transfer,
           comment: Dana Cohen, source_type: import_bit}
      expect_saved: 0
expected:
  - {user: alice, account: alice_card, amount: -80, date: 2026-06-10, status: confirmed, source_type: import_xls,
     external_id: isracard_bit, merged_external_id: bit_new, description: BIT TRANSFER, comment: Dana Cohen}
