id: pending_entry_comment_kept_after_typed_text
description: A comment typed with the manual entry is kept after the typed text when the statement confirms it.
steps:
  - manual_entry: {user: alice, item: lunch, amount: 50, account: alice_card, category: restaurants, date: 2026-06-10, comment: with friends}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -50, date: 2026-06-10, external_id: isracard_78, description: TEST SHOP}
expected:
  - {user: alice, account: alice_card, amount: -50, date: 2026-06-10, status: confirmed, source_type: import_xls,
     external_id: isracard_78, description: TEST SHOP, comment: "lunch, with friends", category: restaurants}
