id: bit_line_confirms_a_pending_bit_entry
description: >
  #12, #17: an entry typed as "paid with Bit" (transit account) is confirmed by the Bit export and
  moves to the account that actually paid. The counterparty joins the typed text in the comment.
steps:
  - manual_entry: {user: alice, item: lunch, amount: 80, account: transit, category: restaurants, date: 2026-06-10}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-11, external_id: bit_new, description: Transfer,
           comment: Dana Cohen, source_type: import_bit}
      expect_saved: 1
expected:
  - {user: alice, account: alice_card, amount: -80, date: 2026-06-11, status: confirmed, source_type: import_bit,
     external_id: bit_new, description: Transfer, comment: "lunch, Dana Cohen", category: restaurants}
