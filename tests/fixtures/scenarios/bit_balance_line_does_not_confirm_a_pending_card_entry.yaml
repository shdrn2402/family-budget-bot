id: bit_balance_line_does_not_confirm_a_pending_card_entry
description: A Bit payment from the Bit balance (transit) is not the same event as a pending card entry.
steps:
  - manual_entry: {user: alice, item: lunch, amount: 80, account: alice_card, category: restaurants, date: 2026-06-10}
  - statement_import:
      user: alice
      lines:
        - {account: transit, amount: -80, date: 2026-06-11, external_id: bit_new, description: Transfer,
           comment: Dana Cohen, source_type: import_bit}
expected:
  - {user: alice, account: alice_card, amount: -80, date: 2026-06-10, status: pending, source_type: manual_text,
     description: lunch, category: restaurants}
  - {user: alice, account: transit, amount: -80, date: 2026-06-11, status: confirmed, source_type: import_bit,
     external_id: bit_new, description: Transfer, comment: Dana Cohen}
