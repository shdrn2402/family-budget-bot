  - manual_entry: {user: alice, item: lunch, amount: 50, account: alice_card, category: restaurants, date: 2026-06-10, comment: second}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -50, date: 2026-06-10, external_id: isracard_oldest, description: TEST SHOP}
expected:
