id: bit_card_line_does_not_enrich_a_bank_row
description: A Bit payment made by card doesn't merge into a bank row of the same amount.
steps:
  - statement_import:
      user: alice
      lines:
        - {account: family_bank, amount: -80, date: 2026-06-10, external_id: leumi_debit, description: TEST SHOP}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-11, external_id: bit_new, description: Transfer,
           comment: Dana Cohen, source_type: import_bit}
      expect_saved: 1
expected:
  - {user: alice, account: family_bank, amount: -80, date: 2026-06-10, status: confirmed, source_type: import_xls,
     external_id: leumi_debit, description: TEST SHOP}
  - {user: alice, account: alice_card, amount: -80, date: 2026-06-11, status: confirmed, source_type: import_bit,
     external_id: bit_new, description: Transfer, comment: Dana Cohen}
