id: closest_date_wins_among_candidates
description: With two pending entries of the same amount, the statement line confirms the one closest in date.
steps:
  - manual_entry: {user: alice, item: lunch, amount: 50, account: alice_card, category: restaurants, date: 2026-06-10}
  - manual_entry: {user: alice, item: dinner, amount: 50, account: alice_card, category: restaurants, date: 2026-06-12}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -50, date: 2026-06-13, external_id: isracard_closest, description: TEST SHOP}
expected:
  - {user: alice, account: alice_card, amount: -50, date: 2026-06-10, status: pending, source_type: manual_text,
     description: lunch, category: restaurants}
  - {user: alice, account: alice_card, amount: -50, date: 2026-06-13, status: confirmed, source_type: import_xls,
     external_id: isracard_closest, description: TEST SHOP, comment: dinner, category: restaurants}
