id: card_line_does_not_confirm_a_pending_transit_entry
description: Only a Bit line may confirm a pending "paid with Bit" entry from another account; a card line may not.
steps:
  - manual_entry: {user: alice, item: lunch, amount: 80, account: transit, category: restaurants, date: 2026-06-10, expect: pending}
  - statement_import:
      user: alice
      lines:
        - {account: alice_card, amount: -80, date: 2026-06-10, external_id: isracard_card_line, description: TEST SHOP}
expected:
  - {user: alice, account: transit, amount: -80, date: 2026-06-10, status: pending, source_type: manual_text,
     description: lunch, category: restaurants}
  - {user: alice, account: alice_card, amount: -80, date: 2026-06-10, status: confirmed, source_type: import_xls,
     external_id: isracard_card_line, description: TEST SHOP}
