id: cash_offset_is_not_taken_over_by_a_bit_row
description: The cash-wallet offset of an ATM withdrawal doesn't merge into a Bit balance credit of the same amount and day.
steps:
  - statement_import:
      user: alice
      lines:
        - {account: transit, amount: 200, date: 2026-06-10, external_id: bit_balance_200, description: Transfer,
           comment: Dana Cohen, source_type: import_bit}
  - statement_import:
      user: alice
      lines:
        - {account: family_bank, amount: -200, date: 2026-06-10, external_id: leumi_atm, description: "MATRIX ATM'S 4402"}
expected:
  - {user: alice, account: transit, amount: 200, date: 2026-06-10, status: confirmed, source_type: import_bit,
     external_id: bit_balance_200, description: Transfer, comment: Dana Cohen}
  - {user: alice, account: family_bank, amount: -200, date: 2026-06-10, status: confirmed, source_type: import_xls,
     external_id: leumi_atm, description: "MATRIX ATM'S 4402", category: cash_withdrawal}
  - {user: alice, account: shared_cash, amount: 200, date: 2026-06-10, status: confirmed, source_type: import_xls,
     external_id: leumi_atm_offset, description: "MATRIX ATM'S 4402", category: cash_withdrawal}
