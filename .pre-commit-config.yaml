# Install once per clone: `uv run pre-commit install` (see README, "Secret scanning").
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets and household values)
        entry: .github/scripts/secret_scan.sh staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
