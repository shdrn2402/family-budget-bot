[project]
name = "my-family-budget"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "pyyaml>=6.0.3",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Explicit, so new ruff releases don't widen the rule set on their own.
select = ["E4", "E7", "E9", "F"]
