name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  # Pull requests run only the test job; build and deploy are skipped (see `if:` below).
  pull_request:
    branches:
      - main

# Least privilege by default; the build job adds `packages: write` for itself.
permissions:
  contents: read

# A new commit on a PR cancels that PR's outdated run. Runs on main are never
# cancelled, so a deploy can't be interrupted halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the integration tests (tests/integration).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so the secret scan can see every commit in the range.
          fetch-depth: 0

      # Pinned version and checksum; a changed release file fails here.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"

      # Scans only the new commits (older history predates this check). The
      # household patterns come from a secret, and findings are redacted
      # because the logs of a public repo are public.
      - name: Scan new commits for secrets
        env:
          GITLEAKS_PRIVATE_CONFIG: ${{ secrets.GITLEAKS_PRIVATE_CONFIG }}
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          trap 'rm -f .gitleaks.private.toml' EXIT
          if [[ -n "$GITLEAKS_PRIVATE_CONFIG" ]]; then
            (umask 077 && printf '%s\n' "$GITLEAKS_PRIVATE_CONFIG" > .gitleaks.private.toml)
          else
            echo "::warning::GITLEAKS_PRIVATE_CONFIG is not set; household values are not checked."
          fi
          .github/scripts/secret_scan.sh range "$SCAN_BASE" "$SCAN_HEAD"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      # Only tests/ for now; bot/ is linted once Stage 1 restructures it.
      - name: Lint tests
        run: uv run ruff check tests

      - name: Run Pytest
        env:
          TELEGRAM_TOKEN: "test_token"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
        run: uv run pytest

  # On pushes to main, decide whether anything deployable changed. Docs-only
  # pushes (docs/ and Markdown files) still run the tests, which branch
  # protection requires, but skip build and deploy. Don't use `[skip ci]`:
  # it skips the required check too and blocks the PR from merging.
  changes:
    name: Detect Deployable Changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the pushed range
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/needs_deploy.sh "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and Push Docker Image
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/shdrn2402/my_family_budget/budget_bot:latest

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yaml"
          target: "~/my_family_budget"

      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          BOT_TIMEZONE: ${{ secrets.BOT_TIMEZONE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TELEGRAM_TOKEN,ALLOWED_USER_IDS,DB_NAME,DB_USER,DB_PASSWORD,PGADMIN_DEFAULT_EMAIL,PGADMIN_DEFAULT_PASSWORD,BOT_TIMEZONE
          script: |
            cd ~/my_family_budget
            
            # Generate .env from secrets
            cat <<EOF > .env
            TELEGRAM_TOKEN=$TELEGRAM_TOKEN
            ALLOWED_USER_IDS=$ALLOWED_USER_IDS
            DB_NAME=$DB_NAME
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            PGADMIN_DEFAULT_EMAIL=$PGADMIN_DEFAULT_EMAIL
            PGADMIN_DEFAULT_PASSWORD=$PGADMIN_DEFAULT_PASSWORD
            BOT_TIMEZONE=$BOT_TIMEZONE
            EOF
            
            mkdir -p backups
            
            # Dump database before pulling new changes
            docker compose exec -T pgdatabase pg_dump -U $DB_USER -F c $DB_NAME > backups/backup_before_deploy_$(date +%Y%m%d_%H%M%S).dump || echo "Backup skipped"
            
            # Pull new bot image
            docker compose pull budget_bot
            
            # Restart containers in detached mode
            docker compose up -d --remove-orphans
            
            # Prune unused images to save disk space
            docker image prune -f