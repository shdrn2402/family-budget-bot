# Alembic configuration. The database URL is built from the bot's DB_* settings
# (see migrations/env.py), so no credentials are stored here.
#
# The bot runs migrations automatically on startup (bot/db_migrate.py).
# Manual use, e.g. to create a new revision:
#   uv run alembic revision -m "describe the change"
#   uv run alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
